# Serves the PWA and forwards API, WebSocket, webhook and preview paths to the backend (same origin).
server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 60m;

  location ~ ^/(auth|me|sessions|uploads|reviews|shared|skills|usage|admin|metrics|workspaces|preview|memory|notes|reminders|integrations|push|billing|bots|webhooks|deploy|healthz) {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;  # terminal output streams
    proxy_read_timeout 900s;
  }
  location /ws/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location / {
    try_files $uri /index.html;
  }
}
